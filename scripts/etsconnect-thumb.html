<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for public/images/ETSConnect/ETSConnect-Thumbnail.webp.
     One thing only: the Compare Bids moment from the ETSConnect prototype —
     the cheapest bid against the safest one, every value as it appears
     there — as a dark card in the project's violet, flat, with no glow. Kept
     inside the middle 1200×750, since phones crop it to 16:10.
     Render: headless Chrome at 1200×900, device scale factor 2. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:900px; overflow:hidden; }
  body { font-family: Inter, sans-serif; color:#f4f2ff; background:#0b0a12;
         display:flex; align-items:center; justify-content:center; }
  .card { width:820px; background:#141220; border-radius:28px; padding:44px 48px 48px;
          border:1px solid rgba(255,255,255,.08); }
  .eyebrow { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; color:#b49cff; }
  .eyebrow svg { width:28px; height:28px; }
  .bids { margin-top:28px; display:grid; gap:18px; }
  .bid { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 30px; border-radius:20px; border:2px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02); }
  .bid.low { border-color:rgba(139,92,246,.7); background:rgba(139,92,246,.10); }
  .name { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; }
  .star { background:rgba(139,92,246,.22); color:#d9ccff; font-weight:600; font-size:17px; padding:4px 10px; border-radius:8px; }
  .tags { margin-top:12px; display:flex; gap:8px; }
  .tag { white-space:nowrap; font-size:17px; font-weight:600; padding:5px 13px; border-radius:999px; background:rgba(255,255,255,.07); color:#d6d2ea; }
  .tag.ok { background:rgba(52,211,153,.14); color:#6ee7b7; }
  .price { text-align:right; font-size:44px; font-weight:800; color:#fff; letter-spacing:-.01em; line-height:1; }
  .price small { display:block; margin-top:6px; font-size:17px; font-weight:500; color:#9a95b5; }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="#b49cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>
      Compare Bids
    </div>
    <div class="bids">
      <div class="bid low">
        <div>
          <div class="name">CorporateWheels Express <span class="star">★ 4.5</span></div>
          <div class="tags"><span class="tag ok">Lowest Bid</span></div>
        </div>
        <div class="price">₹245,000<small>per month</small></div>
      </div>
      <div class="bid">
        <div>
          <div class="name">SafeCommute ETS <span class="star">★ 4.9</span></div>
          <div class="tags"><span class="tag">Female Drivers</span><span class="tag">SOS Button</span></div>
        </div>
        <div class="price">₹285,000<small>per month</small></div>
      </div>
    </div>
  </div>
</body></html>
