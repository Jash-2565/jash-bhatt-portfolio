<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 376" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F87171"/>
    </marker>
  </defs>

  <text x="40" y="60" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="1">BEFORE: A CRECHE CLAIM THROUGH CHROMA, THE FORM-BASED HRMS</text>

  <g font-size="16">
    <rect x="40" y="100" width="260" height="140" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="62" y="150" fill="#FCA5A5" font-weight="700" font-size="19">CHROMA form</text>
    <text x="62" y="180" fill="#E2B4B4">Multi-step fields</text>
    <text x="62" y="210" fill="#9C6666" font-size="14">Rules behind them not shown</text>
    <line x1="300" y1="170" x2="355" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="355" y="100" width="260" height="140" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="377" y="150" fill="#FCA5A5" font-weight="700" font-size="19">Attach documents</text>
    <text x="377" y="180" fill="#E2B4B4">Invoice + certificates</text>
    <text x="377" y="210" fill="#9C6666" font-size="14">Nothing checked yet</text>
    <line x1="615" y1="170" x2="670" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="670" y="100" width="260" height="140" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="692" y="150" fill="#FCA5A5" font-weight="700" font-size="19">Manual review</text>
    <text x="692" y="180" fill="#E2B4B4">Every claim, by hand</text>
    <text x="692" y="210" fill="#9C6666" font-size="14">Slow, error-prone</text>
    <line x1="930" y1="170" x2="985" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="985" y="100" width="260" height="140" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="1007" y="150" fill="#FCA5A5" font-weight="700" font-size="19">Email follow-ups</text>
    <text x="1007" y="180" fill="#E2B4B4">Chasing missing details</text>
    <text x="1007" y="210" fill="#9C6666" font-size="14">Days of back-and-forth</text>
    <line x1="1245" y1="170" x2="1300" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="1300" y="100" width="260" height="140" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="1322" y="150" fill="#FCA5A5" font-weight="700" font-size="19">Decision by email</text>
    <text x="1322" y="180" fill="#E2B4B4">Approved or sent back</text>
    <text x="1322" y="210" fill="#9C6666" font-size="14">Errors surface only now</text>
  </g>

  <!-- rework loop: a returned claim starts over -->
  <path d="M1430 240 C1430 330, 170 330, 170 248" fill="none" stroke="#F87171" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <g transform="translate(800,316)" text-anchor="middle">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#1B1420" stroke="#F87171" stroke-opacity="0.7"/>
    <text y="6" font-size="14" font-weight="700" fill="#FCA5A5" letter-spacing="1">SENT BACK? START OVER</text>
  </g>
</svg>
