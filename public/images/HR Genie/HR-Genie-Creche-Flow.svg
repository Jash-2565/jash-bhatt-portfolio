<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#01F5D1"/>
    </marker>
  </defs>

  <!-- Row label: Before -->
  <text x="40" y="60" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="1">BEFORE — FORM-BASED PROCESS</text>

  <g font-size="15.5">
    <!-- box 1 -->
    <rect x="40" y="86" width="248" height="112" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="64" y="130" fill="#FCA5A5" font-weight="700">Paper Form</text>
    <text x="64" y="152" fill="#E2B4B4">Submitted to HR desk</text>
    <text x="64" y="174" fill="#9C6666" font-size="13">Manual, slow</text>

    <line x1="288" y1="142" x2="330" y2="142" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <!-- box 2 -->
    <rect x="330" y="86" width="248" height="112" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="354" y="130" fill="#FCA5A5" font-weight="700">Manual Review</text>
    <text x="354" y="152" fill="#E2B4B4">Invoice checked by hand</text>
    <text x="354" y="174" fill="#9C6666" font-size="13">Error-prone</text>

    <line x1="578" y1="142" x2="620" y2="142" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <!-- box 3 -->
    <rect x="620" y="86" width="248" height="112" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="644" y="130" fill="#FCA5A5" font-weight="700">Email Follow-ups</text>
    <text x="644" y="152" fill="#E2B4B4">Chasing missing info</text>
    <text x="644" y="174" fill="#9C6666" font-size="13">Back-and-forth</text>

    <line x1="868" y1="142" x2="910" y2="142" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <!-- box 4 -->
    <rect x="910" y="86" width="248" height="112" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="934" y="130" fill="#FCA5A5" font-weight="700">Wait 5–7 Days</text>
    <text x="934" y="152" fill="#E2B4B4">No status visibility</text>
    <text x="934" y="174" fill="#9C6666" font-size="13">Employee left guessing</text>

    <line x1="1158" y1="142" x2="1200" y2="142" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <!-- box 5 -->
    <rect x="1200" y="86" width="248" height="112" rx="14" fill="#1B1420" stroke="#7F1D1D"/>
    <text x="1224" y="130" fill="#FCA5A5" font-weight="700">Approval / Rejection</text>
    <text x="1224" y="152" fill="#E2B4B4">Delivered via email</text>
    <text x="1224" y="174" fill="#9C6666" font-size="13">Process ends here</text>
  </g>

  <!-- divider -->
  <g transform="translate(800,278)" text-anchor="middle">
    <line x1="-760" y1="0" x2="760" y2="0" stroke="#1E293B" stroke-width="1.5"/>
    <circle r="22" fill="#0b1730" stroke="#2563EB" stroke-width="2"/>
    <text y="6" font-size="14" font-weight="700" fill="#9ec8ff">VS</text>
  </g>

  <!-- Row label: After -->
  <text x="40" y="356" font-size="15" font-weight="700" fill="#01F5D1" letter-spacing="1">AFTER — HR GENIE (CONVERSATIONAL)</text>

  <g font-size="15.5">
    <!-- box 1 -->
    <rect x="40" y="382" width="345" height="128" rx="14" fill="#0B1F2E" stroke="#0E7490"/>
    <text x="64" y="428" fill="#67E8F9" font-weight="700">"I want to claim creche fees"</text>
    <text x="64" y="452" fill="#BAE6E6">Employee just types it in chat</text>
    <text x="64" y="474" fill="#7EC7C7" font-size="13">Invoice uploaded in-thread</text>

    <line x1="385" y1="446" x2="425" y2="446" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <!-- box 2 -->
    <rect x="425" y="382" width="345" height="128" rx="14" fill="#0B1F2E" stroke="#0E7490"/>
    <text x="449" y="428" fill="#67E8F9" font-weight="700">OCR Reads Invoice</text>
    <text x="449" y="452" fill="#BAE6E6">Amount &amp; date extracted</text>
    <text x="449" y="474" fill="#7EC7C7" font-size="13">No manual data entry</text>

    <line x1="770" y1="446" x2="810" y2="446" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <!-- box 3 -->
    <rect x="810" y="382" width="380" height="128" rx="14" fill="#0B1F2E" stroke="#0E7490"/>
    <text x="834" y="428" fill="#67E8F9" font-weight="700">Auto-Validate</text>
    <text x="834" y="452" fill="#BAE6E6">City-tier cap + child age check</text>
    <text x="834" y="474" fill="#7EC7C7" font-size="13">Rules applied instantly</text>

    <line x1="1190" y1="446" x2="1230" y2="446" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <!-- box 4 -->
    <rect x="1230" y="382" width="330" height="128" rx="14" fill="#052e22" stroke="#059669"/>
    <text x="1254" y="428" fill="#6EE7B7" font-weight="700">Instant Approval</text>
    <text x="1254" y="452" fill="#B8F5DE">Same chat session</text>
    <text x="1254" y="474" fill="#7ED9B6" font-size="13">Claim processed end-to-end</text>
  </g>

  <g transform="translate(800,600)" text-anchor="middle">
    <rect x="-320" y="0" width="640" height="70" rx="35" fill="#0b1730" stroke="#01F5D1" stroke-opacity="0.5"/>
    <text y="30" font-size="17" font-weight="700" fill="#F1F5F9">A manual, multi-day document review</text>
    <text y="54" font-size="17" font-weight="700" fill="#01F5D1">becomes a same-session conversation.</text>
  </g>
</svg>
