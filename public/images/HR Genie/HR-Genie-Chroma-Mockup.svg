<text x="1116" y="825" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1196" y="262" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1">WHAT THE FORM DOESN'T SAY</text>
<rect x="1196" y="290" width="364" height="96" rx="12" fill="#1B1420" stroke="#7F1D1D"/>
<circle cx="1226" cy="324" r="14" fill="#DC2626"/>
<text x="1226" y="329" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="1252" y="329" font-size="15" fill="#F5D0D0">Age rules aren't shown. A child over</text>
<text x="1252" y="353" font-size="15" fill="#F5D0D0">the limit is only caught at HR review.</text>
<rect x="1196" y="406" width="364" height="96" rx="12" fill="#1B1420" stroke="#7F1D1D"/>
<circle cx="1226" cy="440" r="14" fill="#DC2626"/>
<text x="1226" y="445" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1252" y="445" font-size="15" fill="#F5D0D0">Pick a company-empanelled creche</text>
<text x="1252" y="469" font-size="15" fill="#F5D0D0">and the form still takes the claim.</text>
<rect x="1196" y="522" width="364" height="96" rx="12" fill="#1B1420" stroke="#7F1D1D"/>
<circle cx="1226" cy="556" r="14" fill="#DC2626"/>
<text x="1226" y="561" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1252" y="561" font-size="15" fill="#F5D0D0">No city cap on screen. HR works out</text>
<text x="1252" y="585" font-size="15" fill="#F5D0D0">the payable amount by hand.</text>
<rect x="1196" y="638" width="364" height="96" rx="12" fill="#1B1420" stroke="#7F1D1D"/>
<circle cx="1226" cy="672" r="14" fill="#DC2626"/>
<text x="1226" y="677" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1252" y="677" font-size="15" fill="#F5D0D0">The 2-month invoice rule sits in the</text>
<text x="1252" y="701" font-size="15" fill="#F5D0D0">policy, not on the form.</text>
<rect x="1196" y="754" width="364" height="96" rx="12" fill="#1B1420" stroke="#7F1D1D"/>
<circle cx="1226" cy="788" r="14" fill="#DC2626"/>
<text x="1226" y="793" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1252" y="793" font-size="15" fill="#F5D0D0">Nothing is checked until a person</text>
<text x="1252" y="817" font-size="15" fill="#F5D0D0">reviews it, days later.</text>
