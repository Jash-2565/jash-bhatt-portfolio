<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#01F5D1"/>
    </marker>
  </defs>

  <!-- V1 -->
  <text x="40" y="56" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="1">V1 — FIRST DRAFT</text>

  <g font-size="15.5">
    <rect x="40" y="84" width="272" height="112" rx="14" fill="#141B26" stroke="#334155"/>
    <text x="64" y="128" fill="#E2E8F0" font-weight="700">Ask claim details</text>
    <text x="64" y="152" fill="#94A3B8" font-size="13.5">Child, month, amount, city</text>
    <line x1="312" y1="140" x2="352" y2="140" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="352" y="84" width="272" height="112" rx="14" fill="#141B26" stroke="#334155"/>
    <text x="376" y="128" fill="#E2E8F0" font-weight="700">Request invoice</text>
    <text x="376" y="152" fill="#94A3B8" font-size="13.5">Uploaded after the questions</text>
    <line x1="624" y1="140" x2="664" y2="140" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="664" y="84" width="272" height="112" rx="14" fill="#141B26" stroke="#334155"/>
    <text x="688" y="128" fill="#E2E8F0" font-weight="700">OCR reads invoice</text>
    <text x="688" y="152" fill="#94A3B8" font-size="13.5">Values used as read</text>
    <line x1="936" y1="140" x2="976" y2="140" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="976" y="84" width="272" height="112" rx="14" fill="#141B26" stroke="#334155"/>
    <text x="1000" y="128" fill="#E2E8F0" font-weight="700">Validate</text>
    <text x="1000" y="152" fill="#94A3B8" font-size="13.5">City-tier cap + child age</text>
    <line x1="1248" y1="140" x2="1288" y2="140" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <rect x="1288" y="84" width="272" height="112" rx="14" fill="#141B26" stroke="#334155"/>
    <text x="1312" y="128" fill="#E2E8F0" font-weight="700">Result</text>
    <text x="1312" y="152" fill="#94A3B8" font-size="13.5">Approved, or just "rejected"</text>
  </g>

  <!-- V1 problem markers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="84" r="15" fill="#2A1218" stroke="#F87171" stroke-width="2"/>
    <text x="300" y="89" fill="#FCA5A5">3</text>
    <circle cx="924" cy="84" r="15" fill="#2A1218" stroke="#F87171" stroke-width="2"/>
    <text x="924" y="89" fill="#FCA5A5">1</text>
    <circle cx="1548" cy="84" r="15" fill="#2A1218" stroke="#F87171" stroke-width="2"/>
    <text x="1548" y="89" fill="#FCA5A5">2</text>
  </g>

  <!-- divider -->
  <g transform="translate(800,256)" text-anchor="middle">
    <line x1="-760" y1="0" x2="760" y2="0" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#0b1730" stroke="#2563EB" stroke-width="2"/>
    <text y="6" font-size="14" font-weight="700" fill="#9ec8ff" letter-spacing="1">LEAD REVIEW + TESTING</text>
  </g>

  <!-- V2 -->
  <text x="40" y="330" font-size="15" font-weight="700" fill="#01F5D1" letter-spacing="1">V2 — SHIPPED</text>

  <g font-size="15.5">
    <rect x="40" y="358" width="224" height="112" rx="14" fill="#0B1F2E" stroke="#01F5D1" stroke-width="1.5"/>
    <text x="62" y="402" fill="#67E8F9" font-weight="700">One question</text>
    <text x="62" y="426" fill="#BAE6E6" font-size="13.5">Empanelled or not?</text>
    <line x1="264" y1="414" x2="299" y2="414" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="299" y="358" width="224" height="112" rx="14" fill="#0B1F2E" stroke="#01F5D1" stroke-width="1.5"/>
    <text x="321" y="402" fill="#67E8F9" font-weight="700">Upload invoice</text>
    <text x="321" y="426" fill="#BAE6E6" font-size="13.5">No fields to type</text>
    <line x1="523" y1="414" x2="558" y2="414" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="558" y="358" width="224" height="112" rx="14" fill="#0B1F2E" stroke="#01F5D1" stroke-width="1.5"/>
    <text x="580" y="402" fill="#67E8F9" font-weight="700">OCR, shown in chat</text>
    <text x="580" y="426" fill="#BAE6E6" font-size="13.5">Fields visible to check</text>
    <line x1="782" y1="414" x2="817" y2="414" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="817" y="358" width="224" height="112" rx="14" fill="#0B1F2E" stroke="#01F5D1" stroke-width="1.5"/>
    <text x="839" y="402" fill="#67E8F9" font-weight="700">Date · cap · age</text>
    <text x="839" y="426" fill="#BAE6E6" font-size="13.5">Each rule named if it fails</text>
    <line x1="1041" y1="414" x2="1076" y2="414" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="1076" y="358" width="224" height="112" rx="14" fill="#0B1F2E" stroke="#01F5D1" stroke-width="1.5"/>
    <text x="1098" y="402" fill="#67E8F9" font-weight="700">Summary</text>
    <text x="1098" y="426" fill="#BAE6E6" font-size="13.5">Allowed amount, over-cap</text>
    <line x1="1300" y1="414" x2="1335" y2="414" stroke="#01F5D1" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <rect x="1335" y="358" width="225" height="112" rx="14" fill="#052e22" stroke="#059669"/>
    <text x="1357" y="402" fill="#6EE7B7" font-weight="700">Confirm &amp; submit</text>
    <text x="1357" y="426" fill="#B8F5DE" font-size="13.5">Request ID in chat</text>
  </g>

  <!-- V2 fix markers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="252" cy="358" r="15" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="252" y="363" fill="#01F5D1">3</text>
    <circle cx="511" cy="358" r="15" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="511" y="363" fill="#01F5D1">3</text>
    <circle cx="770" cy="358" r="15" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="770" y="363" fill="#01F5D1">1</text>
    <circle cx="1029" cy="358" r="15" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="1029" y="363" fill="#01F5D1">2</text>
    <circle cx="1288" cy="358" r="15" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="1288" y="363" fill="#01F5D1">1</text>
  </g>

  <!-- legend -->
  <g font-size="15">
    <line x1="40" y1="524" x2="1560" y2="524" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="58" cy="572" r="14" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="58" y="577" fill="#01F5D1" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="84" y="568" fill="#F1F5F9" font-weight="700">OCR misread invoices</text>
    <text x="84" y="592" fill="#94A3B8" font-size="13.5">→ fields shown in chat, summary before submit</text>
    <circle cx="558" cy="572" r="14" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="558" y="577" fill="#01F5D1" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="584" y="568" fill="#F1F5F9" font-weight="700">Rejections didn't say why</text>
    <text x="584" y="592" fill="#94A3B8" font-size="13.5">→ every check names its rule and number</text>
    <circle cx="1058" cy="572" r="14" fill="#0b1730" stroke="#01F5D1" stroke-width="2"/>
    <text x="1058" y="577" fill="#01F5D1" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="1084" y="568" fill="#F1F5F9" font-weight="700">Too many questions up front</text>
    <text x="1084" y="592" fill="#94A3B8" font-size="13.5">→ one question; documents answer the rest</text>
  </g>
</svg>
