<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="ecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08060f"/>
      <stop offset="55%" stop-color="#150e2b"/>
      <stop offset="100%" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="ecGlow1" cx="80%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ecGlow2" cx="12%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#01F5D1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#01F5D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ecLink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#01F5D1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ecBg)"/>
  <rect width="1600" height="900" fill="url(#ecGlow1)"/>
  <rect width="1600" height="900" fill="url(#ecGlow2)"/>

  <!-- subtle grid -->
  <g stroke="#2A2140" stroke-width="1" opacity="0.4">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- top tag -->
  <g transform="translate(96,72)">
    <rect width="430" height="40" rx="20" fill="#1A1030" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <circle cx="24" cy="20" r="4.5" fill="#01F5D1"/>
    <text x="42" y="25" font-size="15" font-weight="600" fill="#C4B5FD" letter-spacing="0.5">CORPORATE MOBILITY PROCUREMENT · INDIA</text>
  </g>

  <!-- headline -->
  <text x="96" y="268" font-size="104" font-weight="700" fill="#F5F3FF" letter-spacing="-1">ETSConnect</text>
  <text x="96" y="322" font-size="27" font-weight="500" fill="#B8A9E8">A B2B procurement marketplace for employee transport</text>

  <!-- two-sided marketplace -->
  <g transform="translate(0,110)">
    <!-- link line -->
    <line x1="470" y1="500" x2="1130" y2="500" stroke="url(#ecLink)" stroke-width="3"/>

    <!-- demand side -->
    <g transform="translate(120,380)">
      <rect width="350" height="240" rx="20" fill="#1A1030" stroke="#4C3A7C"/>
      <text x="34" y="52" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="1.4">DEMAND SIDE</text>
      <text x="34" y="98" font-size="30" font-weight="700" fill="#F5F3FF">Verified</text>
      <text x="34" y="134" font-size="30" font-weight="700" fill="#F5F3FF">Corporates</text>
      <text x="34" y="176" font-size="16" fill="#B0A4CE">IT parks · BPOs · GCCs</text>
      <text x="34" y="202" font-size="16" fill="#B0A4CE">Manufacturing · pharma</text>
    </g>

    <!-- platform core -->
    <g transform="translate(800,500)" text-anchor="middle">
      <circle r="164" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="2"/>
      <circle r="122" fill="#1A1030" stroke="#8B5CF6" stroke-width="3"/>
      <text y="-34" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="1.4">PLATFORM</text>
      <text y="6" font-size="30" font-weight="700" fill="#F5F3FF">ETSConnect</text>
      <text y="44" font-size="16" fill="#01F5D1">discover · bid</text>
      <text y="68" font-size="16" fill="#01F5D1">verify · contract</text>
    </g>

    <!-- supply side -->
    <g transform="translate(1130,380)">
      <rect width="350" height="240" rx="20" fill="#1A1030" stroke="#4C3A7C"/>
      <text x="34" y="52" font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="1.4">SUPPLY SIDE</text>
      <text x="34" y="98" font-size="30" font-weight="700" fill="#F5F3FF">Verified</text>
      <text x="34" y="134" font-size="30" font-weight="700" fill="#F5F3FF">ETS Providers</text>
      <text x="34" y="176" font-size="16" fill="#B0A4CE">Fleet &amp; compliance checked</text>
      <text x="34" y="202" font-size="16" fill="#B0A4CE">Proximity-matched to demand</text>
    </g>
  </g>

  <text x="800" y="830" text-anchor="middle" font-size="17" fill="#8B82A8">Formalising an informal market — save time, reduce risk, control costs, deliver safer commutes</text>
</svg>
